[package]
name = "chat-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
poise = "0.6"
serenity = { version = "0.12", default-features = false, features = ["client", "framework", "gateway", "http", "model", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
dotenv = "0.15"
once_cell = "1.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
